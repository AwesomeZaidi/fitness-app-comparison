name: Suggest a feature to compare
description: Propose a feature that should be added to (or removed from) the comparison.
title: "Feature: <name>"
labels: [feature-suggestion]
body:
  - type: markdown
    attributes:
      value: |
        The 188 features are built bottom-up from what the six apps document about themselves (see METHODOLOGY.md). A feature is missing if an app documents it in its own material but no row covers it — suggestions from outside are especially useful, including features SPLYT does **not** have. Since SPLYT made the grouping decisions, suggestions to merge or split existing features are welcome too.
  - type: input
    id: name
    attributes:
      label: Feature name
      placeholder: e.g. "RPE / RIR logging"
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definition
      description: One or two sentences precise enough that two people would mark the same app the same way. Say what counts as "partial".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to lifters
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Apps that document it
      description: At least one app's own source (App Store listing or release notes, website, help centre) with the sentence that documents it. Others you know have or lack it are useful too.
  - type: dropdown
    id: affiliation
    attributes:
      label: Do you work for or with any of these apps?
      options: ["No", "Yes (please say which above)", "Prefer not to say"]
    validations:
      required: true
